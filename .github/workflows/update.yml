name: update-events
on:
  schedule:
    - cron: "0 18 * * *" # 02:00 WITA daily
  workflow_dispatch:
    inputs:
      tier:
        description: "Tier filter (empty = all)"
        required: false
        default: ""
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r updater/requirements.txt
      - name: Run pipeline
        run: |
          args=""
          [ -n "${{ inputs.tier }}" ] && args="--tier ${{ inputs.tier }}"
          python updater/update.py $args
      - name: Commit data
        run: |
          git config user.name "events-bot"
          git config user.email "events-bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "data: nightly events update $(date -u +%F)"
          git push
